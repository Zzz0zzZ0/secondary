services:
  outbox-api:
    build:
      context: .
      dockerfile: Dockerfile.outbox
    command: ["python", "-m", "uvicorn", "outbox_api.main:app", "--host", "0.0.0.0", "--port", "8010"]
    env_file:
      - ${OUTBOX_SERVICE_ENV_FILE:-config/outbox-docker.env}
    ports:
      - "8010:8010"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5

  outbox-reaper:
    build:
      context: .
      dockerfile: Dockerfile.outbox
    command: ["python", "-m", "app.reaper"]
    env_file:
      - ${OUTBOX_SERVICE_ENV_FILE:-config/outbox-docker.env}
    restart: unless-stopped

  outbox-postgres:
    image: postgres:16-alpine
    profiles: ["standalone-db"]
    environment:
      POSTGRES_DB: sales_automation
      POSTGRES_USER: sales_automation
      POSTGRES_PASSWORD: ${OUTBOX_STANDALONE_DB_PASSWORD:-replace-me}
    ports:
      - "${OUTBOX_STANDALONE_DB_PORT:-55433}:5432"
    volumes:
      - outbox-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  outbox-postgres-data:
